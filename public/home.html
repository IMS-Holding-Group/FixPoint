<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083680">
<title>الرئيسية | FixPoint</title>
<link rel="icon" href="/assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<script src="/assets/js/icons.js" defer></script>
<script src="/assets/js/datetime.js" defer></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/home.js" defer></script>
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="mainnav" id="mainnav" aria-label="القائمة الرئيسية"></nav>
<main class="container" id="main">
  <div class="page-head">
    <div>
      <h1 id="greeting">الرئيسية</h1>
      <p>ملخص بلاغاتك وآخر ما قدّمته</p>
    </div>
    <div class="page-actions">
      <a class="btn btn-primary" href="/new-report.html" data-icon="plus">بلاغ جديد</a>
    </div>
  </div>
  <section class="kpis" aria-label="ملخص البلاغات">
    <div class="kpi kpi-open"><span class="kpi-label" data-icon="alert">مفتوحة</span><span class="kpi-value" id="kpiOpen">-</span></div>
    <div class="kpi kpi-progress"><span class="kpi-label" data-icon="clock">قيد المعالجة</span><span class="kpi-value" id="kpiProgress">-</span></div>
    <div class="kpi kpi-closed"><span class="kpi-label" data-icon="check">مغلقة</span><span class="kpi-value" id="kpiClosed">-</span></div>
    <div class="kpi"><span class="kpi-label" data-icon="file">إجمالي بلاغاتي</span><span class="kpi-value" id="kpiTotal">-</span></div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <h2>آخر البلاغات</h2>
      <a class="btn btn-ghost btn-sm" href="/my-reports.html">عرض كل بلاغاتي</a>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th scope="col">الرقم</th><th scope="col">التصنيف</th><th scope="col">الموقع</th><th scope="col">الحالة</th><th scope="col">تاريخ الإنشاء</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
