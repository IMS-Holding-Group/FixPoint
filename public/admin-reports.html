<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083680">
<title>كل البلاغات | FixPoint</title>
<link rel="icon" href="/assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<script src="/assets/js/icons.js" defer></script>
<script src="/assets/js/datetime.js" defer></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/admin-reports.js" defer></script>
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="mainnav" id="mainnav" aria-label="القائمة الرئيسية"></nav>
<main class="container" id="main">
  <div class="page-head">
    <div>
      <h1>كل البلاغات</h1>
      <p>أرشيف البلاغات مع البحث والفلترة وإعادة التوجيه</p>
    </div>
  </div>
  <div id="listAlert"></div>
  <section class="panel">
    <form class="filters" id="filters">
      <div class="field field-wide">
        <label for="f_q">بحث</label>
        <input id="f_q" name="q" type="search" maxlength="100" placeholder="رقم البلاغ أو اسم المبلِّغ أو كلمة من الوصف">
      </div>
      <div class="field">
        <label for="f_status">الحالة</label>
        <select id="f_status" name="status">
          <option value="">كل الحالات</option>
          <option value="OPEN">مفتوح</option>
          <option value="IN_PROGRESS">قيد المعالجة</option>
          <option value="CLOSED">مغلق</option>
        </select>
      </div>
      <div class="field">
        <label for="f_building">المبنى</label>
        <select id="f_building" name="building_id"><option value="">كل المباني</option></select>
      </div>
      <div class="field">
        <label for="f_category">التصنيف</label>
        <select id="f_category" name="category_id"><option value="">كل التصنيفات</option></select>
      </div>
      <div class="field">
        <label for="f_department">القسم</label>
        <select id="f_department" name="department_id"><option value="">كل الأقسام</option></select>
      </div>
      <div class="field">
        <label for="f_from">من تاريخ</label>
        <input id="f_from" name="from" type="date">
      </div>
      <div class="field">
        <label for="f_to">إلى تاريخ</label>
        <input id="f_to" name="to" type="date">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-icon="search">تطبيق</button>
        <button type="reset" class="btn btn-ghost">مسح</button>
      </div>
    </form>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th scope="col">الرقم</th><th scope="col">تاريخ الإنشاء</th><th scope="col">التصنيف</th><th scope="col">الموقع</th><th scope="col">القسم</th><th scope="col">المبلِّغ</th><th scope="col">الأولوية</th><th scope="col">الحالة</th><th scope="col">إجراءات</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
  <dialog class="modal" id="reassignDialog" aria-labelledby="reassignTitle">
    <form novalidate>
      <div class="modal-head">
        <h2 id="reassignTitle">إعادة توجيه البلاغ</h2>
        <button type="button" class="icon-btn" data-close aria-label="إغلاق" data-icon="x"></button>
      </div>
      <div class="modal-body">
        <div class="modal-alert"></div>
        <p id="reassignInfo"></p>
        <div class="field">
          <label for="r_department">القسم الجديد</label>
          <select id="r_department" name="department_id" required></select>
          <div class="field-error"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn btn-primary" data-icon="route">إعادة التوجيه</button>
        <button type="button" class="btn btn-ghost" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>
</main>
</body>
</html>
