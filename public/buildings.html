<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083680">
<title>المباني والمواقع | FixPoint</title>
<link rel="icon" href="/assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<script src="/assets/js/icons.js" defer></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/map.js" defer></script>
<script src="/assets/js/buildings.js" defer></script>
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="mainnav" id="mainnav" aria-label="القائمة الرئيسية"></nav>
<main class="container" id="main">
  <div class="page-head">
    <div>
      <h1>المباني والمواقع</h1>
      <p>المباني ومواقعها على الخريطة، والأدوار والغرف داخل كل مبنى</p>
    </div>
  </div>
  <div id="listAlert"></div>
  <section class="panel">
    <div class="panel-head">
      <h2>المباني</h2>
      <button type="button" class="btn btn-primary" id="addBuilding" data-icon="plus">إضافة مبنى</button>
    </div>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th scope="col">الرمز</th><th scope="col">اسم المبنى</th><th scope="col">إجراءات</th></tr></thead>
        <tbody id="buildingRows"></tbody>
      </table>
    </div>
    <div class="pager" id="buildingPager"></div>
  </section>
  <div id="locationAlert"></div>
  <section class="panel">
    <div class="panel-head">
      <h2>الأدوار والغرف</h2>
      <button type="button" class="btn btn-primary" id="addLocation" data-icon="plus">إضافة موقع</button>
    </div>
    <form class="filters" id="locationFilters">
      <div class="field">
        <label for="lf_building">المبنى</label>
        <select id="lf_building" name="building_id"></select>
      </div>
    </form>
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th scope="col">المبنى</th><th scope="col">الدور</th><th scope="col">الغرفة</th><th scope="col">إجراءات</th></tr></thead>
        <tbody id="locationRows"></tbody>
      </table>
    </div>
    <div class="pager" id="locationPager"></div>
  </section>
  <dialog class="modal" id="buildingDialog" aria-labelledby="buildingTitle">
    <form novalidate>
      <div class="modal-head">
        <h2 class="modal-title" id="buildingTitle">إضافة مبنى</h2>
        <button type="button" class="icon-btn" data-close aria-label="إغلاق" data-icon="x"></button>
      </div>
      <div class="modal-body">
        <div class="modal-alert"></div>
        <div class="form-row">
          <div class="field">
            <label for="b_code">رمز المبنى</label>
            <input id="b_code" name="code" type="text" maxlength="10" dir="ltr" required>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="b_name">اسم المبنى</label>
            <input id="b_name" name="name" type="text" maxlength="100" required>
            <div class="field-error"></div>
          </div>
        </div>
        <span class="field-label">موقع المبنى على الخريطة</span>
        <div class="map-box" id="buildingMap"><div class="map-placeholder">جارٍ تحميل الخريطة</div></div>
        <p class="hint map-msg" id="buildingMapMsg" role="status"></p>
        <input type="hidden" name="latitude">
        <input type="hidden" name="longitude">
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn btn-primary">حفظ</button>
        <button type="button" class="btn btn-ghost" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>
  <dialog class="modal" id="locationDialog" aria-labelledby="locationTitle">
    <form novalidate>
      <div class="modal-head">
        <h2 class="modal-title" id="locationTitle">إضافة موقع</h2>
        <button type="button" class="icon-btn" data-close aria-label="إغلاق" data-icon="x"></button>
      </div>
      <div class="modal-body">
        <div class="modal-alert"></div>
        <div class="field">
          <label for="l_building">المبنى</label>
          <select id="l_building" name="building_id" required></select>
          <div class="field-error"></div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="l_floor">الدور</label>
            <input id="l_floor" name="floor" type="text" maxlength="20" required>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="l_room">الغرفة أو القاعة (اختياري)</label>
            <input id="l_room" name="room_name" type="text" maxlength="60">
            <div class="field-error"></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn btn-primary">حفظ</button>
        <button type="button" class="btn btn-ghost" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>
</main>
</body>
</html>
