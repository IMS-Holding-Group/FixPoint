<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083680">
<title>إنشاء حساب | FixPoint</title>
<link rel="icon" href="/assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<script src="/assets/js/icons.js" defer></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/register.js" defer></script>
</head>
<body class="auth-page">
<main class="auth-shell" id="main">
  <section class="auth-brand">
    <img class="auth-logo" src="/assets/images/logo.png" alt="FixPoint">
    <p class="auth-lead">بلاغات مرافق الجامعة</p>
  </section>
  <section class="auth-panel">
    <div class="auth-box">
      <h1>إنشاء حساب مبلِّغ</h1>
      <div id="formAlert"></div>
      <form id="registerForm" novalidate>
        <div class="field">
          <label for="full_name">الاسم الكامل</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" maxlength="100" required autofocus>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="university_id">الرقم الجامعي</label>
          <input id="university_id" name="university_id" type="text" autocomplete="username" maxlength="20" dir="ltr" required>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="120" dir="ltr" required>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="password">كلمة السر</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" maxlength="72" required>
            <button type="button" class="password-toggle" aria-label="إظهار كلمة السر" aria-pressed="false" data-icon="eye"></button>
          </div>
          <p class="hint">8 خانات على الأقل وتتضمن حرفاً ورقماً</p>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="confirm">تأكيد كلمة السر</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="72" required>
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
      </form>
      <p class="auth-switch">لديك حساب؟ <a href="/">تسجيل الدخول</a></p>
    </div>
  </section>
</main>
</body>
</html>
