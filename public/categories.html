<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#083680">
<title>التصنيفات وقواعد التوجيه | FixPoint</title>
<link rel="icon" href="/assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<script src="/assets/js/icons.js" defer></script>
<script src="/assets/js/api.js" defer></script>
<script src="/assets/js/ui.js" defer></script>
<script src="/assets/js/categories.js" defer></script>
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="mainnav" id="mainnav" aria-label="القائمة الرئيسية"></nav>
<main class="container" id="main">
  <div class="page-head">
    <div>
      <h1>التصنيفات وقواعد التوجيه</h1>
      <p>كل تصنيف يُوجَّه تلقائياً إلى قسمه المسؤول بأولويته الافتراضية</p>
    </div>
    <div class="page-actions">
      <button type="button" class="btn btn-primary" id="addBtn" data-icon="plus">إضافة تصنيف</button>
    </div>
  </div>
  <div id="listAlert"></div>
  <section class="panel">
    <div class="table-wrap">
      <table class="table">
        <thead><tr><th scope="col">التصنيف</th><th scope="col">القسم المسؤول</th><th scope="col">الأولوية الافتراضية</th><th scope="col">إجراءات</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
  <dialog class="modal" id="editDialog" aria-labelledby="editTitle">
    <form novalidate>
      <div class="modal-head">
        <h2 class="modal-title" id="editTitle">إضافة تصنيف</h2>
        <button type="button" class="icon-btn" data-close aria-label="إغلاق" data-icon="x"></button>
      </div>
      <div class="modal-body">
        <div class="modal-alert"></div>
        <div class="field">
          <label for="c_name">اسم التصنيف</label>
          <input id="c_name" name="name" type="text" maxlength="80" required>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="c_dept">القسم المسؤول</label>
          <select id="c_dept" name="department_id" required></select>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="c_priority">الأولوية الافتراضية</label>
          <select id="c_priority" name="default_priority" required>
            <option value="LOW">منخفضة</option>
            <option value="MEDIUM">متوسطة</option>
            <option value="HIGH">عالية</option>
            <option value="URGENT">عاجلة</option>
          </select>
          <div class="field-error"></div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn btn-primary">حفظ</button>
        <button type="button" class="btn btn-ghost" data-close>إلغاء</button>
      </div>
    </form>
  </dialog>
</main>
</body>
</html>
